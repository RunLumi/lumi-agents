      - agent-harness
      - provider-adapters
      - remote-control
      - orchestration
      - multi-surface
    reviewed_ref: "9ea9c3d5d2c444133e3ddff40eecf38737951589"
    reviewed_at: "2026-09-18"
    observed_license: MIT
    learn:
      - environment owns filesystem, credentials, provider processes and machine state
      - typed RPC plus capability negotiation for independently versioned clients/environments
      - durable intent before side effects
      - provider quirks isolated behind adapters
      - cloud relay can stay out of normal traffic hot path
      - unsafe native helpers isolated from the main app process
      - explicit checkpoints and state-based async testing
    do_not_copy:
      - full event sourcing before Lumi demonstrates the need
      - Electron as a default desktop-shell decision
      - harness-control architecture as a substitute for Lumi business policy and verification


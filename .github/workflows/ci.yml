name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
      - name: Format
        run: cargo +1.98.1 fmt --all -- --check
      - name: Clippy
        run: cargo +1.98.1 clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo +1.98.1 test --workspace

  dependency-policy:
    name: dependency policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Install cargo-deny
        run: cargo +1.98.1 install cargo-deny --locked --version 0.20.2
      - name: Check licenses, advisories, and sources
        run: cargo +1.98.1 deny check licenses advisories sources

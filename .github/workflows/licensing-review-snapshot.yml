name: licensing-review-snapshot
on:
  push:
    branches: [chore/developer-commercial-licensing]
    paths: [.github/workflows/licensing-review-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    if: github.repository == 'RunLumi/lumi-agents'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Archive tracked public source and contribution history
        run: |
          mkdir -p review-artifacts
          git archive --format=tar HEAD | gzip > review-artifacts/source.tar.gz
          git rev-parse HEAD > review-artifacts/revision.txt
          git log --format='%H%x09%aN%x09%aE%x09%s' > review-artifacts/history.tsv
          git log --format='%H%n%B%n---' -- LICENSE CONTRIBUTING.md NOTICE docs/adr/0003-licensing.md > review-artifacts/license-history.txt
          git ls-files -s > review-artifacts/tracked-tree.txt
          sha256sum review-artifacts/source.tar.gz > review-artifacts/source.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: licensing-review-baseline
          path: review-artifacts/
          retention-days: 1

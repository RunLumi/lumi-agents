name: browser protocol

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  handler:
    name: real worker protocol
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Exercise actual worker handler with injected browser adapter
        run: node --experimental-vm-modules --test workers/playwright/tests/worker_protocol.test.js

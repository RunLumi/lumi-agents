# One-time bounded bootstrap for PR #93. Remove after the lockfile is committed.
# No PR code, lifecycle scripts, build commands, or test dependencies are executed.
name: Bootstrap website lockfile
on:
  pull_request:
    paths: ['web/package.json', '.github/workflows/web-lock-bootstrap.yml']
permissions: {}
jobs:
  lock:
    if: >-
      github.event.pull_request.number == 93 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/astro-landing-page'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.13.0'
      - name: Generate only the missing website lock
        working-directory: web
        run: |
          test ! -f package-lock.json
          npm install --package-lock-only --ignore-scripts --before=2026-09-13T00:00:00Z
          npm audit --audit-level=high
      - name: Commit only package-lock.json, never force-push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- web/package-lock.json
          test "$(git diff --cached --name-only)" = 'web/package-lock.json'
          git commit -m 'build(web): lock reviewed website dependency graph'
          git push origin HEAD:refs/heads/feat/astro-landing-page

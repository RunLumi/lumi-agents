[package]
name = "lumi-protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
uuid = { version = "1", features = ["v7", "serde"] }

[dev-dependencies]
# preserve_order is deliberately a dev-only feature: golden fixtures and
# redaction tests assert on literal JSON, while production canonicalization
# relies on lexicographically sorted object keys.
serde_json = { version = "1", features = ["preserve_order"] }

[lints]
workspace = true

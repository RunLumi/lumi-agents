[package]
name = "lumi-packs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
lumi-protocol = { path = "../lumi-protocol" }
lumi-policy = { path = "../lumi-policy" }
lumi-state = { path = "../lumi-state" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
lumi-audit = { path = "../lumi-audit" }
lumi-orchestrator = { path = "../lumi-orchestrator" }
serde_json = { version = "1", features = ["preserve_order"] }

[lints]
workspace = true

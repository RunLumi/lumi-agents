[workspace]
resolver = "2"
members = [
    "crates/lumi-protocol",
    "crates/lumi-policy",
    "crates/lumi-audit",
    "crates/lumi-state",
    "crates/lumi-orchestrator",
    "crates/lumi-models",
    "crates/lumi-browser",
    "crates/lumi-evals",
    "crates/lumi-native",
    "crates/lumi-packs",
    "crates/lumi-workflows",
    "crates/lumi-workspaces",
    "crates/lumi-memory",
    "crates/lumi-agent",
    "crates/lumi-scheduler",
    "crates/lumi-secrets",
    "crates/lumi-runtime",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
license = "Apache-2.0"
repository = "https://github.com/RunLumi/lumi-agents"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[workspace]
resolver = "2"
members = [
    "crates/lumi-protocol",
    "crates/lumi-policy",
    "crates/lumi-runtime",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

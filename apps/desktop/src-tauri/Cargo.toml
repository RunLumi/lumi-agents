[package]
name = "lumi-desktop-app"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
license = "Apache-2.0"

[dependencies]
lumi-protocol = { path = "../../../crates/lumi-protocol" }
lumi-policy = { path = "../../../crates/lumi-policy" }
lumi-audit = { path = "../../../crates/lumi-audit" }
lumi-state = { path = "../../../crates/lumi-state" }
lumi-orchestrator = { path = "../../../crates/lumi-orchestrator" }
lumi-handoff = { path = "../../../crates/lumi-handoff" }
lumi-desktop = { path = "../../../crates/lumi-desktop" }
lumi-native = { path = "../../../crates/lumi-native" }
lumi-project = { path = "../../../crates/lumi-project" }
lumi-secrets = { path = "../../../crates/lumi-secrets" }
lumi-models = { path = "../../../crates/lumi-models" }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "lumi_desktop_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "lumi-desktop-app"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

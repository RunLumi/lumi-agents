<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lumi Agents</title>
  <link rel="icon" type="image/png" href="assets/brand/ic_launcher_foreground.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- ============ Sidebar ============ -->
    <aside class="sidebar">
      <div class="titlebar-strip">
        <div class="traffic-lights" id="traffic-lights">
          <button class="tl tl-close" id="win-close" title="Close" aria-label="Close window"></button>
          <button class="tl tl-min" id="win-min" title="Minimize" aria-label="Minimize window"></button>
          <button class="tl tl-max" id="win-max" title="Maximize" aria-label="Maximize window"></button>
        </div>
      </div>
      <div class="logo-row">
        <img class="logo-full" src="assets/brand/lumi-fulltext.svg" alt="Lumi Agents" title="Lumi Agents" />
        <img class="logo-icon" src="assets/brand/ic_launcher_foreground.png" alt="Lumi" title="Lumi Agents" />
      </div>

      <nav class="nav" id="nav">
        <button class="nav-btn" title="Projects" data-nav="projects">
          <span class="nav-ico" data-glyph="project"></span><span class="nav-label" data-i18n="nav.projects">Projects</span>
        </button>
        <button class="nav-btn" title="Tasks" data-nav="tasks">
          <span class="nav-ico" data-glyph="task"></span><span class="nav-label" data-i18n="nav.tasks">Tasks</span>
          <span class="badge hidden" id="nav-task-badge"></span>
        </button>
        <button class="nav-btn" title="Files" data-nav="files">
          <span class="nav-ico" data-glyph="folder"></span><span class="nav-label" data-i18n="nav.files">Files</span>
        </button>
        <button class="nav-btn" title="Changes" data-nav="changes">
          <span class="nav-ico" data-glyph="fileDiff"></span><span class="nav-label" data-i18n="nav.changes">Changes</span>
        </button>
        <button class="nav-btn" title="Git" data-nav="git">
          <span class="nav-ico" data-glyph="branch"></span><span class="nav-label" data-i18n="nav.git">Git</span>
        </button>
        <button class="nav-btn" title="Artifacts" data-nav="artifacts">
          <span class="nav-ico" data-glyph="artifact"></span><span class="nav-label" data-i18n="nav.artifacts">Artifacts</span>
        </button>
        <button class="nav-btn" title="Evidence" data-nav="evidence">
          <span class="nav-ico" data-glyph="evidence"></span><span class="nav-label" data-i18n="nav.evidence">Evidence</span>
        </button>
        <button class="nav-btn" title="Approvals" data-nav="approvals">
          <span class="nav-ico" data-glyph="approval"></span><span class="nav-label" data-i18n="nav.approvals">Approvals</span>
          <span class="badge hidden" id="nav-approval-badge"></span>
        </button>
      </nav>

      <div class="spacer"></div>
      <button class="collapse-toggle" id="sidebar-collapse" title="Collapse menu" aria-label="Collapse menu">
        <span data-glyph="chevronLeft"></span>
      </button>

      <div class="engine-card">
        <div class="engine-row">
          <span class="dot" id="engine-dot"></span>
          <div>
            <div class="engine-name">Lumi Engine</div>
            <div class="engine-state" id="engine-state" data-i18n="misc.engineChecking">Checking…</div>
          </div>
        </div>
        <button class="btn btn-danger-outline btn-block" id="kill-switch"><span data-glyph="stop"></span><span class="nav-label"> Stop Agent</span></button>
      </div>
    </aside>

    <!-- ============ Main ============ -->
    <div class="main">
      <header class="topbar" data-tauri-drag-region>
        <div class="breadcrumb" id="breadcrumb">
          <span class="crumb current">Projects</span>
        </div>
        <button class="searchbox" id="search-open" title="Search (⌘K)">
          <span class="search-ico" data-glyph="search"></span>
          <span class="search-ph">Search projects, files, tasks, or ask Lumi…</span>
          <span class="kbd">⌘K</span>
        </button>
        <div class="topbar-right">
          <button class="btn btn-danger-outline btn-sm" id="stop-agent"><span data-glyph="stop"></span><span data-i18n="nav.stop">Stop Agent</span></button>
          <div class="avatar" title="Local user">LU</div>
        </div>
      </header>

      <main class="content" id="content">
        <!-- Views render here -->
      </main>
    </div>
  </div>

  <!-- ============ Command palette ============ -->
  <div class="palette-overlay hidden" id="palette">
    <div class="palette">
      <div class="palette-input-row">
        <span class="search-ico" data-glyph="search"></span>
        <input id="palette-input" type="text" data-i18n-placeholder="palette.placeholder" placeholder="Search projects, files, tasks…" />
        <span class="kbd">esc</span>
      </div>
      <div class="palette-body">
        <div class="palette-rail" id="palette-rail"></div>
        <div class="palette-results" id="palette-results"></div>
      </div>
      <div class="palette-ask">
        <span class="palette-ask-ico" id="palette-ask-ico"></span>
        <input id="palette-ask" type="text" data-i18n-placeholder="palette.ask" placeholder="Ask Lumi to do anything…" />
        <span class="kbd">↵</span>
      </div>
    </div>
  </div>

  <!-- ============ Toasts ============ -->
  <div class="toasts" id="toasts"></div>

  <script>
    // DEV ONLY: ?devmock serves fixture data for visual previews.
    // The packaged app never receives this query parameter.
    if (new URLSearchParams(location.search).has("devmock")) {
      document.write('<script src="dev-preview.js"><\/script>');
    }
  </script>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>

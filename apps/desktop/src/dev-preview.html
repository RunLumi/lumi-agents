<!doctype html>
<!-- DEV ONLY: visual preview harness with fixture data. Not part of the
     production app surface (index.html never references this file).
     Load with #/route and ?devmock semantics built in. -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Lumi Agents — DEV PREVIEW</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="pill pill-amber" style="position:fixed;top:4px;right:8px;z-index:99">DEV PREVIEW — fixture data</div>
  <div id="app-root"></div>
  <script src="dev-preview.js"></script>
  <script>
    // Synchronously graft the production shell markup, then run the app.
    const req = new XMLHttpRequest();
    req.open("GET", "index.html", false);
    req.send(null);
    const doc = new DOMParser().parseFromString(req.responseText, "text/html");
    const root = document.getElementById("app-root");
    for (const child of [...doc.querySelectorAll(".app, .palette-overlay, .toasts")]) {
      root.append(child);
    }
    const app = document.createElement("script");
    app.src = "app.js";
    document.body.append(app);
  </script>
</body>
</html>
